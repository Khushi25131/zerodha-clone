# Private staging: loopback listeners only. Access through the documented SSH tunnels.
# Do NOT change to public listeners: shared collections have no account authorization.
server {
    listen 127.0.0.1:8080;
    server_name localhost;
    root /opt/zerodha/current/frontend/build;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /static/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
server {
    listen 127.0.0.1:8081;
    server_name localhost;
    root /opt/zerodha/current/dashboard/build;
    index index.html;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location /api/ {
        proxy_pass http://127.0.0.1:3002/;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_hide_header X-Powered-By;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        limit_except GET POST OPTIONS { deny all; }
    }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /static/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
